
name: CI/CD CiberHeroes

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-build:
    name: Tests, lint, security and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Build React frontend
        run: npm run build --prefix frontend

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Security analysis with ESLint
        run: npm run lint

      - name: Lint React
        run: npm run lint --prefix frontend

      - name: Build React frontend
        run: npm run build --prefix frontend

      - name: Verify Docker image
        run: |
          docker build --tag ciberheroes:ci .

          container=$(docker run --detach \
            --publish 127.0.0.1:8080:10000 \
            --env PORT=10000 \
            ciberheroes:ci)

          trap 'docker logs "$container"; docker rm -f "$container"' EXIT

          for i in $(seq 1 10); do
            if node scripts/verify-deployment.cjs http://127.0.0.1:8080; then
              exit 0
            fi
            sleep 2
          done

          exit 1

  deploy-dev:
    name: Deploy to development
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          if [ -z "$RENDER_DEV_HOOK" ]; then
            echo "Missing repository secret RENDER_DEV_HOOK"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_DEV_HOOK" \
            --output /dev/null

  smoke-test:
    name: Verify development deployment
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify development application
        env:
          DEV_URL: https://miapp-dev-0pav.onrender.com
        run: |
          for i in $(seq 1 12); do
            if node scripts/verify-deployment.cjs "$DEV_URL"; then
              exit 0
            fi
            sleep 10
          done

          exit 1
