name: CI/CD CiberHeroes

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: CodeQL SAST
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  test-build:
    name: Tests, lint, security and Docker
    needs: sast
    if: >-
      ${{
        !cancelled() &&
        (
          needs.sast.result == 'success' ||
          (github.ref != 'refs/heads/main' && needs.sast.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Build React frontend
        run: npm run build --prefix frontend

      - name: Run root and backend tests with 85% coverage
        run: npm run test:coverage

      - name: Security analysis with ESLint
        run: npm run lint

      - name: Lint React
        run: npm run lint --prefix frontend

      - name: Verify Docker image
        run: |
          docker build --tag ciberheroes:ci .

          container=$(docker run --detach \
            --publish 127.0.0.1:8080:10000 \
            --env PORT=10000 \
            ciberheroes:ci)

          trap 'docker logs "$container"; docker rm -f "$container"' EXIT

          for i in $(seq 1 10); do
            if node scripts/verify-deployment.cjs http://127.0.0.1:8080; then
              exit 0
            fi
            sleep 2
          done

          exit 1

  deploy-dev:
    name: Deploy to development
    needs: [sast, test-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          if [ -z "$RENDER_DEV_HOOK" ]; then
            echo "Missing repository secret RENDER_DEV_HOOK"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_DEV_HOOK" \
            --output /dev/null

  smoke-test:
    name: Verify development deployment
    needs: [sast, test-build, deploy-dev]
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        needs.sast.result == 'success' &&
        needs.test-build.result == 'success' &&
        (
          (github.event_name == 'push' && needs.deploy-dev.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && needs.deploy-dev.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify development application
        env:
          DEV_URL: https://miapp-dev-0pav.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            if node scripts/verify-deployment.cjs "$DEV_URL" --require-database; then
              exit 0
            fi
            sleep 10
          done

          exit 1

  dast:
    name: OWASP ZAP Baseline
    needs: smoke-test
    if: needs.smoke-test.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/zap-baseline.yml

  deploy-prod:
    name: Deploy to production
    needs: [sast, test-build, smoke-test, dast]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.sast.result == 'success' &&
      needs.test-build.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.dast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Trigger Render production deploy
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
        run: |
          if [ -z "$RENDER_PROD_HOOK" ]; then
            echo "Missing production environment secret RENDER_PROD_HOOK"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_PROD_HOOK" \
            --output /dev/null
