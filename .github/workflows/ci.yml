name: CI/CD CiberHeroes

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: CodeQL SAST
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  test-build:
    name: Tests, lint, security and Docker
    needs: sast
    if: >-
      ${{
        !cancelled() &&
        (
          needs.sast.result == 'success' ||
          (github.ref != 'refs/heads/main' && needs.sast.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Build React frontend
        run: npm run build --prefix frontend

      - name: Test guardian frontend session recovery
        run: npm test --prefix frontend

      - name: Start temporary MongoDB for CI
        run: npm run mongo:up

      - name: Run tests including MongoDB persistence with 85% coverage
        run: npm run test:mongo

      - name: Security analysis with ESLint
        run: npm run lint

      - name: Lint React
        run: npm run lint --prefix frontend

      - name: Verify Docker image
        run: |
          docker build --tag ciberheroes:ci .

          # Temporary credentials for this runner only. Atlas is not used.
          export SESSION_SECRET=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$SESSION_SECRET"

          # This job runs on Linux; host networking reaches the local MongoDB.
          container=$(docker run --detach \
            --network host \
            --env PORT=8080 \
            --env MONGODB_URI='mongodb://127.0.0.1:27017/ciberheroes_docker_ci?replicaSet=rs0&directConnection=true' \
            --env SESSION_SECRET \
            ciberheroes:ci)

          trap 'docker logs "$container"; docker rm -f "$container"' EXIT

          for i in $(seq 1 10); do
            if node scripts/verify-deployment.cjs http://127.0.0.1:8080 --require-database; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Stop temporary MongoDB
        if: always()
        run: docker compose -f compose.mongo.yml down --volumes

  deploy-dev:
    name: Deploy to development
    needs: [sast, test-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          if [ -z "$RENDER_DEV_HOOK" ]; then
            echo "Missing repository secret RENDER_DEV_HOOK"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_DEV_HOOK" \
            --output /dev/null

  smoke-test:
    name: Verify development deployment
    needs: [sast, test-build, deploy-dev]
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        needs.sast.result == 'success' &&
        needs.test-build.result == 'success' &&
        (
          (github.event_name == 'push' && needs.deploy-dev.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && needs.deploy-dev.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify development application
        env:
          DEV_URL: https://miapp-dev-0pav.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            if node scripts/verify-deployment.cjs "$DEV_URL" --require-database; then
              exit 0
            fi
            sleep 10
          done

          exit 1

  dast:
    name: OWASP ZAP Baseline
    needs: smoke-test
    if: needs.smoke-test.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/zap-baseline.yml

  deploy-prod:
    name: Deploy to production
    needs: [sast, test-build, smoke-test, dast]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.sast.result == 'success' &&
      needs.test-build.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.dast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy and verify the validated SHA
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
          RENDER_PROD_URL: ${{ vars.RENDER_PROD_URL }}
        run: node scripts/deploy-production.cjs
