name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run tests with 85% coverage
        run: npm run test:coverage

      - name: Security analysis with ESLint
        run: npm run lint

      - name: Lint React
        run: npm run lint --prefix frontend

      - name: Test family lookup frontend
        run: npm test --prefix frontend

      - name: Verify Docker image
        run: |
          docker build --tag ciberheroes:ci .
          container=$(docker run --detach --publish 127.0.0.1:8080:10000 --env PORT=10000 ciberheroes:ci)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for i in $(seq 1 10); do
            if node scripts/verify-deployment.cjs http://127.0.0.1:8080; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy-dev:
    name: Deploy to development
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          if [ -z "$RENDER_DEV_HOOK" ]; then
            echo "Missing repository secret RENDER_DEV_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_DEV_HOOK" --output /dev/null

      - name: Wait for Render startup
        run: sleep 30

  smoke-test:
    name: Development health check
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify development application
        env:
          DEV_URL: https://miapp-dev-0pav.onrender.com
        run: |
          for i in $(seq 1 12); do
            if node scripts/verify-deployment.cjs "$DEV_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  deploy-prod:
    name: Deploy to production
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render production deploy
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
        run: |
          if [ -z "$RENDER_PROD_HOOK" ]; then
            echo "Missing repository secret RENDER_PROD_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_PROD_HOOK" --output /dev/null