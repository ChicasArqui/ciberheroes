name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --runInBand

      - name: Security analysis with ESLint
        run: npm run lint

      - name: Verify Docker build
        run: docker build --tag ciberheroes:ci .

  deploy-dev:
    name: Deploy to development
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          if [ -z "$RENDER_DEV_HOOK" ]; then
            echo "Missing repository secret RENDER_DEV_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_DEV_HOOK" --output /dev/null

      - name: Wait for Render startup
        run: sleep 30

  smoke-test:
    name: Development health check
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify development API
        env:
          DEV_URL: https://miapp-dev-0pav.onrender.com
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "${DEV_URL%/}/health" --output health.json; then
              if jq -e '.status == "healthy"' health.json > /dev/null; then
                echo "Development API responds with healthy status"
                exit 0
              fi
            fi
            echo "Attempt $i failed; retrying in 10 seconds"
            sleep 10
          done
          echo "Development API did not become healthy"
          exit 1

  deploy-prod:
    name: Deploy to production
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render production deploy
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
        run: |
          if [ -z "$RENDER_PROD_HOOK" ]; then
            echo "Missing repository secret RENDER_PROD_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$RENDER_PROD_HOOK" --output /dev/null
